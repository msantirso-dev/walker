# Despliegue en Coolify (build pack "Docker Compose") o con docker compose.
# Coolify completa las variables ${...} desde la pestaña Environment Variables.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: genera/usa el dominio del servicio y enruta al puerto 3000
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
      DATABASE_URL: postgresql://camada:${POSTGRES_PASSWORD}@db:5432/camada
      APP_URL: ${APP_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      PAYMENT_SIMULATOR: ${PAYMENT_SIMULATOR:-disabled}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEED_DEMO: ${SEED_DEMO:-0}
      UPLOAD_DIR: /data/uploads
    volumes:
      - camada-data:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: camada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: camada
    volumes:
      - camada-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camada -d camada"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  camada-data:
  camada-pg:
